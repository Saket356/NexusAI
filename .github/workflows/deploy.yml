
name: nexus ai deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Gateway
        run: |
          docker build \
            -f backend/gateway/Dockerfile \
            -t gateway:latest backend

      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Push Gateway
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Build Auth
        run: |
          docker build \
            -f backend/services/auth/Dockerfile \
            -t auth:latest backend

      - name: Tag Auth
        run: |
          docker tag auth:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth:latest

      - name: Push Auth
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth:latest

      - name: Build Chat
        run: |
          docker build \
            -f backend/services/chat/Dockerfile \
            -t chat:latest backend

      - name: Tag Chat
        run: |
          docker tag chat:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat:latest

      - name: Push Chat
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat:latest

      - name: Build Agent
        run: |
          docker build \
            -f backend/services/agent/Dockerfile \
            -t agent:latest backend

      - name: Tag Agent
        run: |
          docker tag agent:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent:latest

      - name: Push Agent
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent:latest

      - name: Build Billing
        run: |
          docker build \
            -f backend/services/billing/Dockerfile \
            -t billing:latest backend

      - name: Tag Billing
        run: |
          docker tag billing:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing:latest

      - name: Push Billing
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing:latest

      - name: Deploy Gateway
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.GATEWAY_SERVICE }} \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deploy Auth
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AUTH_SERVICE }} \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deploy Chat
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.CHAT_SERVICE }} \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deploy Agent
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AGENT_SERVICE }} \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deploy Billing
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.BILLING_SERVICE }} \
            --force-new-deployment \
            --region $AWS_REGION

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: |
         npm ci
         npm run build

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync \
            frontend/dist \
            s3://${{ secrets.S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront_DISTRIBUTION_ID }} \
            --paths "/*"
